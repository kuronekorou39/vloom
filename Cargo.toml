[workspace]
members = ["core-wasm", "fountain", "vcode"]
# app/ 配下の Flutter ブリッジ crate (rust_lib_vloom) は cargokit が独立ビルドするため除外。
# py/ の PyO3 クレートも maturin が独立ビルドし、pyo3 の extension-module が
# cargo test --workspace とかみ合わないため除外する。どちらも path 依存で本ワークスペースの
# コアを再利用するので、実装は分岐しない。
exclude = ["app", "py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# wasm バイナリを最小化 (core-wasm の release ビルド向け)。
# ワークスペース直下に置かないと非 root パッケージのプロファイルは無視される。
[profile.release]
opt-level = "z"
lto = true
