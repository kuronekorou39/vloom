[workspace]
members = ["core-wasm", "fountain", "vcode"]
# app/ 配下の Flutter ブリッジ crate (rust_lib_vloom) は cargokit が独立ビルドするため除外。
# py/ の PyO3 クレートも maturin が独立ビルドし、pyo3 の extension-module が
# cargo test --workspace とかみ合わないため除外する。どちらも path 依存で本ワークスペースの
# コアを再利用するので、実装は分岐しない。
exclude = ["app", "py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# core-wasm の release ビルド向け。
# 以前は opt-level = "z" (サイズ最小) にしていたが、PWA の受信はスキャナが計算律速で、
# 実機 (Pixel 9a / Chrome) では 3.6 fps しか出ていなかった。wasm はスレッドを使えず
# rayon も効かないぶん、コード生成の質がそのまま効く。サイズは 236KB -> 318KB に増えるが、
# Service Worker が一度キャッシュすれば毎回は落ちてこないので速度を採る。
[profile.release]
opt-level = 3
lto = true
