<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vloom (PC)</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./favicon.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#111318" />
  <script>
    // 旧ブラウザ診断 (ES5 のみで書く)。ES モジュールが構文エラーで死ぬと
    // タブ切替ごと無反応になり原因が見えないため、ここでエラーを拾って表示する。
    window.addEventListener('error', function (e) {
      var el = document.getElementById('coreStatus');
      if (!el || el.className === 'ng') return;
      var where = e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '';
      el.className = 'ng';
      el.textContent = '読み込み失敗: ' + (e.message || '不明なエラー') + where +
        ' — お使いのブラウザが古い可能性があります (iOS 15 以降を推奨)';
    }, true);
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318; --surface: #1a1d24; --surface-2: #22262f; --hover: #2c313b;
      --line: #2a2e37; --field: #0e1015;
      --text: #e6e6e6; --muted: #9aa0aa; --label: #b8bec8;
      --accent: #5b8cff; --accent-hover: #6f9bff;
      --ok: #5ad17a; --ng: #f2777a; --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    header { padding: 0.7em 1.1em; background: var(--surface); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 0.7em 1.2em; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.05em; font-weight: 600; }
    nav { display: flex; gap: 0.35em; flex-wrap: wrap; }
    nav button { background: var(--surface-2); color: var(--text); border: none; border-radius: 6px;
      padding: 0.45em 1em; font-size: 0.95em; cursor: pointer; transition: background 0.12s; }
    nav button:hover { background: var(--hover); }
    nav button.active { background: var(--accent); color: #fff; }
    #coreStatus { font-size: 0.85em; margin-left: auto; display: inline-flex; align-items: center; gap: 0.45em; }
    #coreStatus::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex: none; }
    #coreStatus.ok::before { background: var(--ok); }
    #coreStatus.ng::before { background: var(--ng); }
    main { padding: 1em; max-width: 860px; margin: 0 auto; }
    .pane { display: none; }
    .pane.active { display: block; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1em 1.1em; margin: 0.8em 0; }
    .row { display: flex; gap: 0.8em; align-items: center; flex-wrap: wrap; margin: 0.6em 0; }
    .row:first-child { margin-top: 0; } .row:last-child { margin-bottom: 0; }
    .ok { color: var(--ok); } .ng { color: var(--ng); } .muted { color: var(--muted); }
    button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 0.55em 1.1em; font-size: 1em; cursor: pointer; transition: background 0.12s; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button.secondary { background: var(--surface-2); }
    button.secondary:hover:not(:disabled) { background: var(--hover); }
    button:disabled { background: #262a31; color: #6a707a; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    select, input[type="number"] { background: var(--field); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 0.4em 0.5em; font-size: 1em; }
    label { font-size: 0.9em; color: var(--label); display: inline-flex; align-items: center; gap: 0.4em; }
    /* ファイル選択 (ネイティブ既定の不揃いな見た目を整える) */
    input[type="file"] { color: var(--muted); font-size: 0.9em; max-width: 100%; }
    input[type="file"]::file-selector-button { background: var(--surface-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 0.45em 0.9em; margin-right: 0.7em;
      font-size: 0.95em; cursor: pointer; transition: background 0.12s; }
    input[type="file"]::file-selector-button:hover { background: var(--hover); }
    /* 送信ステージ: QR を白背景で大きく表示 */
    #txStage { display: none; position: fixed; inset: 0; background: #fff; z-index: 50;
      flex-direction: column; align-items: center; justify-content: center; }
    #txCanvas { image-rendering: pixelated; background: #fff; }
    #txBar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20,22,28,0.92);
      color: var(--text); padding: 0.5em 1em; display: flex; gap: 1em; align-items: center; }
    #txBar .grow { flex: 1; font-size: 0.9em; }
    /* 受信: カメラ映像。開始前後で高さが変わらないよう 4:3 の枠を確保し、映像は
       中身を歪めず枠内に収める (縦横比が違うカメラは上下に黒帯)。開始前は「停止中」。 */
    #rxVideoWrap, #vrxVideoWrap, #calRxWrap { position: relative; background: #000;
      border-radius: var(--radius); overflow: hidden; max-width: 600px;
      aspect-ratio: 4 / 3; display: grid; place-items: center; }
    #rxVideoWrap::after, #vrxVideoWrap::after, #calRxWrap::after { content: "カメラ停止中";
      position: absolute; inset: 0; z-index: 0; display: grid; place-items: center;
      color: #59606b; font-size: 0.9em; }
    #rxVideo, #vrxVideo, #calVideo { position: relative; z-index: 1;
      width: 100%; height: auto; display: block; }
    progress { width: 100%; height: 10px; border: none; border-radius: 5px; overflow: hidden;
      background: var(--field); }
    progress::-webkit-progress-bar { background: var(--field); }
    progress::-webkit-progress-value { background: var(--accent); }
    progress::-moz-progress-bar { background: var(--accent); }
    /* カメラ実測の診断 (どのカメラ / 実解像度 / fps / 明るさ / px per セル)。
       行数が増えても下の要素が飛ばないよう最小高さを確保する。 */
    .diag { white-space: pre-line; font-size: 0.8em; color: var(--muted); line-height: 1.6;
      margin-top: 0.5em; min-height: 2.6em; }
    .camsel { max-width: 22em; }
    /* 受信完了時の計測値 */
    .stats { border-collapse: collapse; margin: 0.6em 0; font-size: 0.9em; }
    .stats th { text-align: left; font-weight: 400; color: var(--muted); padding: 3px 12px 3px 0; }
    .stats td { font-weight: 600; padding: 3px 0; }
    textarea { width: 100%; box-sizing: border-box; background: var(--field); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 0.5em; font-size: 1em;
      font-family: inherit; resize: vertical; }
    /* セグメント切替 (校正) */
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { background: #262a31; border: none; color: #cfd3da; padding: 0.45em 0.9em;
      font-size: 0.95em; cursor: pointer; border-radius: 0; transition: background 0.12s; }
    .seg button:hover { background: var(--hover); }
    .seg button.active { background: var(--accent); color: #fff; }
    /* 校正: レベル判定チップ */
    #calChips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0.6em 0; }
    .chip { background: #262a31; border: 1px solid var(--line); border-radius: 14px;
      padding: 0.2em 0.7em; font-size: 0.85em; color: var(--muted); }
    .chip.ok { color: var(--ok); border-color: #2e6b3f; }
    /* 校正: 全画面テストパターン表示 */
    #calStage { display: none; position: fixed; inset: 0; background: #fff; z-index: 60;
      flex-direction: column; align-items: center; justify-content: center; }
    #calCanvas { image-rendering: pixelated; background: #fff; max-width: 100vmin; max-height: 90vh; }
    #calBar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20,22,28,0.92);
      color: var(--text); padding: 0.5em 1em; display: flex; gap: 0.8em; align-items: center; }
    #calBar .grow { flex: 1; }
    #calBar #calLabel { font-size: 1em; }
  </style>
</head>
<body>
  <header>
    <h1>Vloom — PC 送受信</h1>
    <nav>
      <button id="tabSend" class="active">送信</button>
      <button id="tabRecv">受信</button>
      <button id="tabVSend">V送信</button>
      <button id="tabVRecv">V受信</button>
      <button id="tabCal">校正</button>
    </nav>
    <div id="coreStatus" class="muted">WASM 読み込み中...</div>
  </header>
  <main>
    <!-- ============ 送信 ============ -->
    <section id="paneSend" class="pane active">
      <div class="card">
        <div class="row">
          <input type="file" id="txFile" />
        </div>
        <div class="row">
          <textarea id="txText" rows="2" placeholder="または、ここにテキストを入力 (ファイル未選択時に送信)"></textarea>
        </div>
        <div class="row">
          <label>グリッド:
            <select id="txGrid">
              <option value="1x1">1×1</option>
              <option value="1x2" selected>1×2</option>
              <option value="2x2">2×2</option>
            </select></label>
          <label>EC:
            <select id="txEc">
              <option>L</option><option selected>M</option><option>Q</option><option>H</option>
            </select></label>
          <label>FPS: <input type="number" id="txFps" value="10" min="2" max="30" style="width:4em" /></label>
          <button id="txStart">送信開始</button>
        </div>
        <div id="txInfo" class="muted"></div>
      </div>
      <div class="card muted">
        スマホアプリの「受信」でこの画面の QR を読み取ってください。
        大きなファイルもブロック分割でストリーミング送信します (RAM 一定)。
      </div>
    </section>

    <!-- ============ 受信 ============ -->
    <section id="paneRecv" class="pane">
      <div class="card">
        <div class="row">
          <label>グリッド (送信側に合わせる):
            <select id="rxGrid">
              <option value="1x1">1×1</option>
              <option value="1x2" selected>1×2</option>
              <option value="2x2">2×2</option>
            </select></label>
          <button id="rxStart">カメラ開始</button>
          <button id="rxStop" class="secondary" disabled>停止</button>
        </div>
        <div class="row">
          <label>カメラ: <select id="rxCamera" class="camsel"></select></label>
        </div>
        <div id="rxVideoWrap"><video id="rxVideo" autoplay playsinline muted></video></div>
        <div style="margin-top:0.6em">
          <progress id="rxProgress" value="0" max="1"></progress>
          <div id="rxInfo" class="muted">待機中 — 送信側 (スマホ/PC) の QR に向けてください</div>
          <div id="rxDiag" class="diag"></div>
        </div>
        <div id="rxResult"></div>
      </div>
    </section>

    <!-- ============ V送信 (vcode) ============ -->
    <section id="paneVSend" class="pane">
      <div class="card">
        <div class="row">
          <label>計測データ (条件を振って比べる用):
            <select id="vtxTest">
              <option value="">使わない (ファイル/テキストを送る)</option>
              <option value="./testdata/test-100KB.jpg">100KB の画像</option>
              <option value="./testdata/test-500KB.jpg">500KB の画像</option>
              <option value="./testdata/test-1MB.jpg">1MB の画像</option>
              <option value="./testdata/test-2MB.jpg">2MB の画像</option>
            </select></label>
        </div>
        <div class="row"><input type="file" id="vtxFile" /></div>
        <div class="row">
          <textarea id="vtxText" rows="2" placeholder="または、ここにテキストを入力 (ファイル未選択時に送信)"></textarea>
        </div>
        <div class="row">
          <label>格子:
            <select id="vtxGrid">
              <option value="7x6" selected>7×6 (高密度)</option>
              <option value="5x4">5×4 (標準)</option>
              <option value="9x8">9×8 (超高密度)</option>
              <option value="11x10">11×10 (最大)</option>
            </select></label>
          <label>bit/セル:
            <select id="vtxBpc">
              <option value="2" selected>2 (輝度4値)</option>
              <option value="1">1 (白黒)</option>
            </select></label>
          <label>FPS: <input type="number" id="vtxFps" value="12" min="2" max="60" style="width:4em" /></label>
          <button id="vtxStart">V送信開始</button>
        </div>
        <div id="vtxTheory" class="muted"></div>
        <div id="vtxInfo" class="muted">スマホアプリ「V受信」でこの画面に向けてください。</div>
      </div>
    </section>

    <!-- ============ V受信 (vcode) ============ -->
    <section id="paneVRecv" class="pane">
      <div class="card">
        <div class="row">
          <button id="vrxStart">カメラ開始</button>
          <button id="vrxStop" class="secondary" disabled>停止</button>
        </div>
        <div class="row">
          <label>カメラ: <select id="vrxCamera" class="camsel"></select></label>
          <label>格子:
            <select id="vrxGrid">
              <option value="auto" selected>自動 (候補総当たり)</option>
              <option value="5x4">5×4</option>
              <option value="7x6">7×6</option>
              <option value="9x8">9×8</option>
              <option value="11x10">11×10</option>
            </select></label>
        </div>
        <div id="vrxVideoWrap"><video id="vrxVideo" autoplay playsinline muted></video></div>
        <div style="margin-top:0.6em">
          <div id="vrxInfo" class="muted">待機中 — 送信側 (スマホ/PC) の vcode に向けてください</div>
          <div id="vrxDiag" class="diag"></div>
        </div>
        <div id="vrxResult"></div>
      </div>
    </section>

    <!-- ============ 校正 ============ -->
    <section id="paneCal" class="pane">
      <div class="card">
        <div class="row">
          <div class="seg" id="calKind">
            <button data-k="qr" class="active">QR</button>
            <button data-k="vcode">vcode</button>
          </div>
          <div class="seg" id="calMode">
            <button data-m="send" class="active">送信(表示)</button>
            <button data-m="recv">受信(確認)</button>
          </div>
        </div>
      </div>

      <!-- 送信(表示) -->
      <div id="calSendView">
        <div class="card">
          <div class="row"><button id="calShow">テストパターンを全画面表示</button></div>
          <div class="muted">受信側が読めたらそのレベルはOK。ゆるい→きつい と上げて限界を探す。
            もう一方の端末 (スマホアプリ / 別PC) の「校正 → 受信(確認)」で読み取ります。</div>
        </div>
      </div>

      <!-- 受信(確認) -->
      <div id="calRecvView" style="display:none">
        <div class="card">
          <div class="row">
            <button id="calRecvStart">カメラ開始</button>
            <button id="calRecvStop" class="secondary" disabled>停止</button>
            <button id="calRecvReset" class="secondary">リセット</button>
          </div>
          <div class="row">
            <label>カメラ: <select id="calCamera" class="camsel"></select></label>
          </div>
          <div id="calRxWrap"><video id="calVideo" autoplay playsinline muted></video></div>
          <div id="calBest" class="muted" style="margin-top:0.6em">送信側のテストパターンに向けてください</div>
          <div id="calBlocks" class="muted" style="font-size:0.85em"></div>
          <div id="calDiag" class="diag"></div>
          <div id="calChips"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 送信ステージ (全画面 QR 表示) -->
  <div id="txStage">
    <canvas id="txCanvas" width="1080" height="1080"></canvas>
    <div id="txBar">
      <div class="grow" id="txStatus"></div>
      <button id="txStop" class="secondary">停止</button>
    </div>
  </div>

  <!-- 校正ステージ (全画面テストパターン表示) -->
  <div id="calStage">
    <canvas id="calCanvas" width="1080" height="1080"></canvas>
    <div id="calBar">
      <button id="calPrev" class="secondary">◀</button>
      <span id="calLabel"></span>
      <button id="calNext" class="secondary">▶</button>
      <span class="grow"></span>
      <button id="calClose" class="secondary">閉じる</button>
    </div>
  </div>

  <script src="./vendor/qrcode.js"></script>
  <script src="./vendor/jsQR.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
