name: build

# Flutter アプリ (app/) + Rust FFI ブリッジ (cargokit) のネイティブビルド。
# - main への push: ビルド検証 + 成果物 (APK / 署名なし IPA) を Actions アーティファクトに
# - タグ push (v*): 上記に加え、GitHub Release を作成し APK と IPA を添付 (恒久DLリンク)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 署名用 Secrets があればリリース鍵で署名する。無い場合は debug 鍵のまま進む
      # (fork の PR など鍵を持たない環境でもビルド検証を通すため)。
      - name: Set up release signing
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::署名用 Secrets が未設定です。debug 鍵でビルドします (配布不可)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK (release)
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: vloom-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 署名なしでビルド (証明書は Sideloadly が再署名時に付与する)。
      - name: Build iOS (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      # プライバシーマニフェストは 2024 年 5 月以降、無いとアップロードで弾かれる。
      # pbxproj への登録漏れ (Resources ビルドフェーズに入れ忘れ) はコンパイルが
      # 通ってしまうので気づけない。ここを門にする
      - name: Check privacy manifest is bundled
        run: |
          APP=app/build/ios/iphoneos/Runner.app
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "PrivacyInfo.xcprivacy が Runner.app に入っていません。"
            echo "app/ios/Runner.xcodeproj/project.pbxproj の Resources ビルドフェーズを確認してください。"
            exit 1
          fi
          plutil -lint "$APP/PrivacyInfo.xcprivacy"

      # Runner.app を Payload/ に入れて zip → .ipa 化 (Sideloadly が受け取れる形式)。
      - name: Package unsigned IPA
        working-directory: app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry vloom-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: vloom-ios-unsigned-ipa
          path: app/build/ios/iphoneos/vloom-unsigned.ipa
          if-no-files-found: error

  # App Store 提出 (タグ push のときだけ)。
  # 手元が Windows で Xcode を持たないので、署名も書き出しもアップロードもここでやる。
  # 署名まわりの Secrets が無いうちは各ステップが飛ぶだけで、失敗にはならない。
  # 一度だけやる準備 (App ID / プロファイル / Secrets) と毎回の手順は
  # docs/app-store-submission.md。ココメシ (koko-meshi) と同じ組み立て。
  #
  # 必要な Secrets:
  #   IOS_CERTIFICATE_BASE64      : Apple Distribution 証明書 (.p12) を base64
  #   IOS_CERTIFICATE_PASSWORD    : その .p12 のパスワード
  #   IOS_APPSTORE_PROFILE_BASE64 : App Store 用プロビジョニングプロファイルを base64
  #   APPSTORE_API_KEY_ID         : App Store Connect API キーの ID
  #   APPSTORE_API_ISSUER_ID      : 同 Issuer ID
  #   APPSTORE_API_PRIVATE_KEY    : AuthKey_xxx.p8 の中身そのもの
  ios-appstore:
    if: startsWith(github.ref, 'refs/tags/v')
    # Apple の要件 (2026-04-28 以降) で iOS 26 SDK / Xcode 26 以降が要る。
    # macos-latest だと世代が変わったときに黙って古い SDK になりうるので固定する
    runs-on: macos-26
    # step の if では secrets コンテキストを参照できないので、ジョブの env に写して判定する
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Import signing certificate
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: env.IOS_APPSTORE_PROFILE_BASE64 != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/vloom-appstore.mobileprovision

      # archive の前段として必須。条件付きにしてはいけない。
      # このステップが ios/Flutter/ephemeral のパッケージ解決とプラグイン統合をやっていて、
      # 飛ばすと GeneratedPluginRegistrant.m が参照するモジュールが見つからず archive が
      # 落ちる。提出物はこの下の archive が署名して作る
      - name: Build iOS (no codesign, plugin integration)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Check privacy manifest is bundled
        run: |
          APP=app/build/ios/iphoneos/Runner.app
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "PrivacyInfo.xcprivacy が Runner.app に入っていません"
            exit 1
          fi
          plutil -lint "$APP/PrivacyInfo.xcprivacy"

      - name: Archive and export signed IPA
        if: env.IOS_APPSTORE_PROFILE_BASE64 != ''
        working-directory: app
        run: |
          echo "=== 使える署名 ==="
          security find-identity -v -p codesigning || true

          # flutter build ipa は Development 証明書を要求するが、CI にあるのは
          # Distribution だけなので xcodebuild を直接呼ぶ。
          #
          # 署名設定は xcodebuild の引数では渡さない。引数で渡すとワークスペース内の
          # 全ターゲットに効いてしまい、パッケージ由来のリソースバンドルが
          # "does not support provisioning profiles" で archive を失敗させる。
          # Runner の xcconfig に書けば Runner だけに掛かる
          cat >> ios/Flutter/Release.xcconfig <<'XCCONFIG'

          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          DEVELOPMENT_TEAM = M5D5CQRGX8
          PROVISIONING_PROFILE_SPECIFIER = Vloom AppStore
          XCCONFIG

          ARCHIVE_PATH=$RUNNER_TEMP/Runner.xcarchive
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions-AppStore.plist

          V=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          NAME="vloom-v${V%%+*}-b${V##*+}-appstore.ipa"
          cp "$(ls build/ios/ipa/*.ipa | head -1)" "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        if: env.APPSTORE_API_KEY_ID != '' && env.IPA_NAME != ''
        working-directory: app
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          # altool は PEM の解釈が厳しい。CRLF を落として末尾に改行を付ける
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" | tr -d '\r' \
            > "$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_NAME" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      # 配布証明書で署名してあるので他人の端末には入らない。Release には添付せず、
      # 何を送ったかを確認できるように Actions のアーティファクトにだけ残す
      - uses: actions/upload-artifact@v7
        if: env.IPA_NAME != ''
        with:
          name: vloom-ios-appstore-ipa
          path: app/${{ env.IPA_NAME }}
          retention-days: 7

  # タグ (v*) のときだけ: 成果物を集めて GitHub Release に添付する。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          # iOS の署名なし IPA は Release に添付しない。受け取った側で自分の Apple ID による
          # 再署名が必要で、配布物として機能しないため。iOS は ios-appstore ジョブが
          # App Store Connect へ送る (docs/app-store-submission.md)。
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Android APK。iOS は App Store から (公開までは README 参照)。" \
            dist/vloom-android-apk/app-release.apk
