name: build

# Flutter アプリ (app/) + Rust FFI ブリッジ (cargokit) のネイティブビルド。
# - main への push: ビルド検証 + 成果物 (APK / 署名なし IPA) を Actions アーティファクトに
# - タグ push (v*): 上記に加え、GitHub Release を作成し APK と IPA を添付 (恒久DLリンク)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 署名用 Secrets があればリリース鍵で署名する。無い場合は debug 鍵のまま進む
      # (fork の PR など鍵を持たない環境でもビルド検証を通すため)。
      - name: Set up release signing
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::署名用 Secrets が未設定です。debug 鍵でビルドします (配布不可)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK (release)
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: vloom-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 署名なしでビルド (証明書は Sideloadly が再署名時に付与する)。
      - name: Build iOS (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      # Runner.app を Payload/ に入れて zip → .ipa 化 (Sideloadly が受け取れる形式)。
      - name: Package unsigned IPA
        working-directory: app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry vloom-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: vloom-ios-unsigned-ipa
          path: app/build/ios/iphoneos/vloom-unsigned.ipa
          if-no-files-found: error

  # タグ (v*) のときだけ: 成果物を集めて GitHub Release に添付する。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          # iOS の署名なし IPA は Release に添付しない。受け取った側で自分の Apple ID による
          # 再署名が必要で (無料アカウントは 7 日で失効)、配布物として機能しないため。
          # ビルド自体は ios ジョブで継続し、成果物は Actions のアーティファクトに残る。
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Android APK。iOS は Mac でのソースビルドが必要です (README 参照)。" \
            dist/vloom-android-apk/app-release.apk
