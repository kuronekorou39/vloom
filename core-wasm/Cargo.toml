[package]
name = "vloom-core-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for Vloom Fountain code (wasm-bindgen 経由でブラウザから呼ぶ)。"

[lib]
name = "vloom_core_wasm"
crate-type = ["cdylib"]

[dependencies]
vloom-fountain = { path = "../fountain" }
vloom-vcode = { path = "../vcode" }
wasm-bindgen = "0.2"
